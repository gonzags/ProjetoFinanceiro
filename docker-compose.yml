# ==============================================================================
# docker-compose.yml — Ledger Horizon (Produção Debian 12)
#
# Arquitetura do servidor:
#   - Apenas o serviço "app" é gerenciado aqui.
#   - O Postgres já roda no servidor na rede "server_default" com o nome
#     de container "postgres_db" (provisionado separadamente).
#   - A porta 8300 é exposta externamente (proxy reverso do Debian aponta aqui).
#   - Credenciais vêm exclusivamente do arquivo .env (nunca hardcoded aqui).
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger_horizon_app
    restart: unless-stopped
    ports:
      - "8300:8000"
    env_file:
      - .env
    networks:
      - server_default

networks:
  server_default:
    external: true
