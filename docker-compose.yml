services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger_horizon_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ledger_horizon
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ledger_network

  postgres:
    image: postgres:16-alpine
    container_name: ledger_horizon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_horizon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger_horizon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledger_network

networks:
  ledger_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
