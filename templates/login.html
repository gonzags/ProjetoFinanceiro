<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à Plataforma | Ledger Horizon</title>
  
  <!-- Estilos e Fontes OFL -->
  <link rel="stylesheet" href="/static/css/ledger_horizon.css">
  
  <style>
    .lh-auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .lh-auth-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
    }
    .lh-auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .lh-auth-header .lh-logo-icon {
      margin: 0 auto 12px;
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
    }
    .lh-auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--lh-border);
      margin-bottom: 24px;
      gap: 8px;
    }
    .lh-auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--lh-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lh-auth-tab.active {
      color: var(--lh-primary);
      border-bottom-color: var(--lh-primary);
    }
    .lh-form-group {
      margin-bottom: 16px;
    }
    .lh-form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--lh-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .lh-form-input {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--lh-text);
      background-color: var(--lh-surface-card);
      border: 1px solid var(--lh-border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .lh-form-input:focus {
      border-color: var(--lh-primary);
      box-shadow: 0 0 0 2px rgba(23, 73, 77, 0.15);
    }
    .lh-auth-alert {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fdf2f2;
      color: #991b1b;
      border: 1px solid #f87171;
    }
    [data-theme="dark"] .lh-auth-alert {
      background: rgba(153, 27, 27, 0.2);
      color: #fca5a5;
      border-color: #7f1d1d;
    }
    .lh-oauth-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--lh-text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .lh-oauth-divider::before,
    .lh-oauth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--lh-border);
    }
    .lh-oauth-divider span {
      padding: 0 12px;
    }
    .lh-btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--lh-surface-card);
      border: 1px solid var(--lh-border);
      color: var(--lh-text);
      padding: 10px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }
    .lh-btn-google:hover {
      background-color: rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"] .lh-btn-google:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    .lh-auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--lh-text-muted);
    }
  </style>
</head>
<body>
  <div class="lh-auth-container">
    
    <div style="position: absolute; top: 16px; right: 16px;">
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Alternar modo de contraste">
        <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="lh-card lh-auth-card">
      <div class="lh-auth-header">
        <div class="lh-logo-icon" aria-hidden="true">LH</div>
        <h2 style="margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--lh-text);">Ledger Horizon</h2>
        <p style="margin: 6px 0 0; font-size: 0.88rem; color: var(--lh-text-muted);">Plataforma de Engenharia e Inteligência Financeira</p>
      </div>

      {% if error %}
      <div class="lh-auth-alert" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="lh-auth-tabs">
        <button type="button" class="lh-auth-tab {% if active_tab != 'register' %}active{% endif %}" onclick="switchTab('login')">Entrar</button>
        <button type="button" class="lh-auth-tab {% if active_tab == 'register' %}active{% endif %}" onclick="switchTab('register')">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <form id="loginForm" action="/login?next={{ next_url }}" method="POST" style="display: {% if active_tab != 'register' %}block{% else %}none{% endif %};">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="lh-form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" name="email" class="lh-form-input" placeholder="seu@email.com" required autocomplete="email">
        </div>

        <div class="lh-form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" name="password" class="lh-form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="lh-btn lh-btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">
          Entrar no Sistema
        </button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="registerForm" action="/register?next={{ next_url }}" method="POST" style="display: {% if active_tab == 'register' %}block{% else %}none{% endif %};">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="lh-form-group">
          <label for="registerName">Nome Completo</label>
          <input type="text" id="registerName" name="name" class="lh-form-input" placeholder="Seu nome" required autocomplete="name">
        </div>

        <div class="lh-form-group">
          <label for="registerEmail">E-mail</label>
          <input type="email" id="registerEmail" name="email" class="lh-form-input" placeholder="seu@email.com" required autocomplete="email">
        </div>

        <div class="lh-form-group">
          <label for="registerPassword">Senha</label>
          <input type="password" id="registerPassword" name="password" minlength="6" class="lh-form-input" placeholder="Mínimo de 6 caracteres" required autocomplete="new-password">
        </div>

        <button type="submit" class="lh-btn lh-btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">
          Criar Conta e Iniciar Onboarding
        </button>
      </form>

      {% if google_auth_enabled %}
      <div class="lh-oauth-divider">
        <span>ou continue com</span>
      </div>

      <a href="/auth/google?next={{ next_url }}" class="lh-btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continuar com o Google</span>
      </a>
      {% endif %}

      <div class="lh-auth-footer">
        Criptografia PBKDF2 (600k) • Sessão com Cookie HttpOnly Seguro
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabs = document.querySelectorAll('.lh-auth-tab');

      if (tab === 'register') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
      } else {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'light';
      const target = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', target);
      localStorage.setItem('lh_theme', target);
      updateThemeIcons(target);
    }

    function updateThemeIcons(theme) {
      const sun = document.getElementById('themeIconSun');
      const moon = document.getElementById('themeIconMoon');
      if (theme === 'dark') {
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
      } else {
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
      }
    }

    // Inicializar tema a partir do localStorage
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('lh_theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcons(saved);
    });
  </script>
</body>
</html>
