<!-- Análise Financeira do Mês -->
<section class="lh-decision-hub" id="decisionHubSection" aria-labelledby="decisionHubTitle">
  <div class="lh-card-header">
    <div>
      <h2 id="decisionHubTitle" class="lh-card-title">📊 Análise Financeira do Mês</h2>
      <p style="font-size: 0.82rem; color: var(--lh-ink-subdued); margin-top: 4px;" id="analysisTimestamp">
        Carregando análise...
      </p>
    </div>
    <div>
      <button id="recalculateBtn"
              style="padding: 8px 16px; background: #1E56A0; color: #fff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;"
              onclick="recalculateConsensus()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span id="recalculateBtnText">↻ Atualizar análise</span>
      </button>
    </div>
  </div>

  <!-- Distribuição Recomendada -->
  <div class="lh-alloc-boxes">
    <div class="lh-alloc-box nec">
      <div class="lh-alloc-box-label">Gastos Essenciais</div>
      <div class="lh-alloc-box-val tabular-nums" id="aiAllocNec">--%</div>
      <div style="font-size: 0.75rem; color: var(--lh-ink-subdued); margin-top: 4px;">Fixos + Necessários</div>
    </div>
    <div class="lh-alloc-box des">
      <div class="lh-alloc-box-label">Qualidade de Vida</div>
      <div class="lh-alloc-box-val tabular-nums" id="aiAllocDes">--%</div>
      <div style="font-size: 0.75rem; color: var(--lh-ink-subdued); margin-top: 4px;">Lazer + Pessoal</div>
    </div>
    <div class="lh-alloc-box fut">
      <div class="lh-alloc-box-label">Futuro & Quitação</div>
      <div class="lh-alloc-box-val tabular-nums" id="aiAllocFut">--%</div>
      <div style="font-size: 0.75rem; color: var(--lh-ink-subdued); margin-top: 4px;">Reserva + Dívidas</div>
    </div>
  </div>

  <!-- O que a análise indica -->
  <div style="margin-bottom: 16px;">
    <div style="font-size: 0.8rem; font-weight: 600; color: var(--lh-ink-subdued); margin-bottom: 6px;">O que a análise indica</div>
    <div class="lh-reasoning-quote" id="aiReasoningQuote">
      Aguardando dados financeiros...
    </div>
  </div>

  <!-- Pontos de Atenção -->
  <div>
    <div style="font-size: 0.8rem; font-weight: 600; color: var(--lh-ink-subdued); margin-bottom: 8px;">⚠️ Pontos de atenção</div>
    <div class="lh-risk-tags" id="aiRiskTagsContainer">
      <span class="lh-risk-tag">Verificando situação financeira...</span>
    </div>
  </div>

  <!-- Timestamp discreto -->
  <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--lh-border); font-size: 0.72rem; color: var(--lh-ink-muted); text-align: right;">
    <span id="analysisTimestampFooter">—</span>
  </div>
</section>
