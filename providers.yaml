# ==============================================================================
# providers.yaml - Configuração dos Provedores de LLM Gratuitos (Ledger Horizon)
# Conforme especificação em claudeaudita.pdf (Setembro 2026)
# ==============================================================================

settings:
  request_timeout_seconds: 12.0
  circuit_breaker_cooldown_seconds: 60
  max_schema_retries: 1
  max_consensus_rounds: 3
  convergence_divergence_threshold: 0.05   # <= 5 pontos percentuais
  convergence_min_confidence: 0.70         # >= 0.7 em todos os agentes ativos
  cache_ttl_hours: 24

providers:
  groq:
    name: "Groq Llama-3.3"
    role: "Propositor / Gerador Rápido"
    env_key: "GROQ_API_KEY"
    env_model: "GROQ_MODEL"
    default_model: "openai/gpt-oss-120b"
    base_url: "https://api.groq.com/openai/v1"
    round: 1
    max_tokens: 1200
    temperature: 0.2

  gemini:
    name: "Google Gemini Flash"
    role: "Auditor de Risco e Raciocínio Profundo"
    env_key: "GEMINI_API_KEY"
    env_model: "GEMINI_MODEL"
    default_model: "gemini-2.5-flash-lite"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    round: 1
    max_tokens: 1200
    temperature: 0.2

  mistral:
    name: "Mistral Free"
    role: "Sanity-check / Segunda Opinião"
    env_key: "MISTRAL_API_KEY"
    env_model: "MISTRAL_MODEL"
    default_model: "open-mistral-7b"
    base_url: "https://api.mistral.ai/v1"
    round: 2
    max_tokens: 1200
    temperature: 0.2

  openrouter:
    name: "OpenRouter Free"
    role: "Camada de Contingência / Fallback"
    env_key: "OPENROUTER_API_KEY"
    env_model: "OPENROUTER_MODEL"
    default_model: "qwen/qwen3.8-27b:free"
    base_url: "https://openrouter.ai/api/v1"
    round: 2
    max_tokens: 1200
    temperature: 0.2

  cloudflare:
    name: "Cloudflare Workers AI"
    role: "Agente Sintetizador Final / Desempate"
    env_key: "CLOUDFLARE_API_TOKEN"
    env_account: "CLOUDFLARE_ACCOUNT_ID"
    env_model: "CLOUDFLARE_MODEL"
    default_model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    base_url_template: "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1"
    round: 3
    max_tokens: 1200
    temperature: 0.2
